<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF RAG Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 280px;
      background: #1a1a1a;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
    }

    #sidebar h2 { font-size: 1rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

    #upload-area {
      border: 2px dashed #333;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    #upload-area:hover { border-color: #6c63ff; }
    #upload-area p { font-size: 0.85rem; color: #777; margin-top: 8px; }
    #file-input { display: none; }

    #upload-btn {
      background: #6c63ff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    #upload-btn:hover { background: #574fd6; }
    #upload-btn:disabled { background: #333; cursor: not-allowed; }

    #upload-status { font-size: 0.8rem; color: #6c63ff; min-height: 18px; }

    #pdf-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }

    .pdf-item {
      padding: 10px 12px;
      background: #222;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      border: 1px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pdf-item:hover { border-color: #6c63ff; }
    .pdf-item.active { border-color: #6c63ff; background: #2a2040; color: #a89fff; }

    /* Main chat area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a2a;
      font-size: 0.95rem;
      color: #aaa;
    }
    #chat-header span { color: #a89fff; font-weight: 600; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-end;
      background: #6c63ff;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-bottom-left-radius: 4px;
    }
    .message.thinking {
      align-self: flex-start;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      color: #555;
      font-style: italic;
    }

    #input-area {
      padding: 16px 24px;
      border-top: 1px solid #2a2a2a;
      display: flex;
      gap: 10px;
    }

    #question-input {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #question-input:focus { border-color: #6c63ff; }
    #question-input::placeholder { color: #444; }

    #send-btn {
      background: #6c63ff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    #send-btn:hover { background: #574fd6; }
    #send-btn:disabled { background: #333; cursor: not-allowed; }

    #empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 1rem;
    }
  </style>
</head>
<body>

<div id="sidebar">
  <h2>Your PDFs</h2>

  <div id="upload-area" onclick="document.getElementById('file-input').click()">
    <div style="font-size:2rem">📄</div>
    <p>Click to upload a PDF</p>
    <input type="file" id="file-input" accept=".pdf" onchange="handleFileSelect(event)" />
  </div>

  <button id="upload-btn" disabled onclick="uploadPDF()">Upload</button>
  <div id="upload-status"></div>

  <h2>Uploaded</h2>
  <div id="pdf-list"></div>
</div>

<div id="main">
  <div id="chat-header">Chatting with: <span id="active-pdf-name">none selected</span></div>
  <div id="empty-state">← Select or upload a PDF to start chatting</div>
  <div id="messages" style="display:none"></div>
  <div id="input-area" style="display:none">
    <input type="text" id="question-input" placeholder="Ask a question about the PDF..." onkeydown="if(event.key==='Enter') sendQuestion()" />
    <button id="send-btn" onclick="sendQuestion()">Send</button>
  </div>
</div>

<script>
  const API = "";
  let selectedFile = null;
  let activePDF = null;

  async function loadPDFs() {
    const res = await fetch(`${API}/pdfs`);
    const data = await res.json();
    renderPDFList(data.pdfs);
  }

  function renderPDFList(pdfs) {
    const list = document.getElementById("pdf-list");
    list.innerHTML = "";
    pdfs.forEach(name => {
      const el = document.createElement("div");
      el.className = "pdf-item" + (name === activePDF ? " active" : "");
      el.textContent = name;
      el.onclick = () => selectPDF(name);
      list.appendChild(el);
    });
  }

  function selectPDF(name) {
    activePDF = name;
    document.getElementById("active-pdf-name").textContent = name;
    document.getElementById("empty-state").style.display = "none";
    document.getElementById("messages").style.display = "flex";
    document.getElementById("input-area").style.display = "flex";
    document.getElementById("messages").innerHTML = "";
    loadPDFs();
  }

  function handleFileSelect(event) {
    selectedFile = event.target.files[0];
    if (selectedFile) {
      document.getElementById("upload-btn").disabled = false;
      document.getElementById("upload-status").textContent = `Selected: ${selectedFile.name}`;
    }
  }

  async function uploadPDF() {
    if (!selectedFile) return;
    const btn = document.getElementById("upload-btn");
    const status = document.getElementById("upload-status");
    btn.disabled = true;
    status.textContent = "Uploading & ingesting...";

    const formData = new FormData();
    formData.append("file", selectedFile);

    try {
      const res = await fetch(`${API}/upload`, { method: "POST", body: formData });
      const data = await res.json();
      if (res.ok) {
        status.textContent = "✓ Done!";
        selectedFile = null;
        document.getElementById("file-input").value = "";
        loadPDFs();
        selectPDF(data.pdf_name);
      } else {
        status.textContent = `Error: ${data.detail}`;
        btn.disabled = false;
      }
    } catch {
      status.textContent = "Upload failed.";
      btn.disabled = false;
    }
  }

  function appendMessage(role, text) {
    const messages = document.getElementById("messages");
    const el = document.createElement("div");
    el.className = `message ${role}`;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  async function sendQuestion() {
    const input = document.getElementById("question-input");
    const question = input.value.trim();
    if (!question || !activePDF) return;

    input.value = "";
    document.getElementById("send-btn").disabled = true;
    appendMessage("user", question);
    const thinking = appendMessage("thinking", "Thinking...");

    try {
      const res = await fetch(`${API}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pdf_name: activePDF, question })
      });
      const data = await res.json();
      thinking.remove();
      appendMessage("bot", res.ok ? data.answer : `Error: ${data.detail}`);
    } catch {
      thinking.remove();
      appendMessage("bot", "Request failed.");
    }

    document.getElementById("send-btn").disabled = false;
    input.focus();
  }

  loadPDFs();
</script>
</body>
</html>
